# Render Blueprint - deploys the Express API. Set MONGO_URI and CLIENT_ORIGINS
# in the Render dashboard (they are marked sync: false so they are not in git).
services:
  - type: web
    name: social-app-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
